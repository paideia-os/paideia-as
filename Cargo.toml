[workspace]
resolver = "2"
members = [
    "crates/paideia-as",
    "crates/paideia-as-lexer",
    "crates/paideia-as-parser",
    "crates/paideia-as-ast",
    "crates/paideia-as-types",
    "crates/paideia-as-effects",
    "crates/paideia-as-elaborator",
    "crates/paideia-as-runtime",
    "crates/paideia-as-ir",
    "crates/paideia-as-encoder",
    "crates/paideia-as-emit",
    "crates/paideia-as-emitter-elf",
    "crates/paideia-as-emitter-pax",
    "crates/paideia-as-emitter-pe",
    "crates/paideia-as-dwarf",
    "crates/paideia-as-diagnostics",
    "crates/paideia-as-linker",
    "crates/paideia-as-test",
    "crates/paideia-as-doc",
    "crates/paideia-lsp",
    "crates/paideia-fmt",
    "crates/paideia-pq-sign",
    "crates/paideia-as-crypto",
    "crates/paideia-satellite-runtime",
    "crates/paideia-stdlib",
    "tests/e2e",
    "tests/end-to-end",
    "tests/effects-corpus",
    "tests/ir-payload",
    "tests/linearity-regression",
    "tests/lsp-harness",
    "tests/migration-smoke/cap",
    "tests/modules-multifile",
    "tests/opt-regression",
    "tests/opt-regression/align",
    "tests/opt-regression/branch-hint",
    "tests/opt-regression/dse",
    "tests/opt-regression/encode-tight",
    "tests/opt-regression/macro-fusion",
    "tests/opt-regression/peephole",
    "tests/opt-regression/pool-constants",
    "tests/opt-regression/schedule",
    "tests/opt-regression/tailcall",
    "tests/opt-regression/unroll",
    "tests/borrow-corpus",
    "tests/reflection-corpus",
    "tests/pax-load-smoke",
    "tests/pq-corpus",
    "tests/stdlib-smoke",
    "tests/uefi-smoke",
    "tests/uefi-stdlib-fixture",
    "tests/cross-build",
    "tests/self-hosting",
    "tools/ddc",
    "tools/klog-migrate",
    "tools/pax-introspect",
]

[workspace.package]
version = "0.30.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Santiago Núñez-Corrales <snunezcr@gmail.com>"]
repository = "https://github.com/paideia-os/paideia-as"
homepage = "https://paideia-os.org"

[workspace.dependencies]
# Diagnostics
miette = "7"
thiserror = "2"
ariadne = "0.5"
static_assertions = "1"
jsonschema = "0.18"
smallvec = "1"

# CLI
clap = { version = "4", features = ["derive"] }
similar = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Parser tooling
chumsky = "0.10"
logos = "0.15"
unicode-ident = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1"

# LSP
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Object file emission
object = { version = "0.36", features = ["all"] }
gimli = { version = "0.32", default-features = false, features = ["write", "std"] }

# Cryptography (for PAX signing per PQ trust root design)
ed25519-dalek = "2"
sha3 = "0.10"
blake3 = "1"
ml-dsa = "0.1"
# ML-KEM (FIPS 203) — RustCrypto sibling of `ml-dsa`. Wrapped by
# `paideia-as-crypto::kem::ml_kem_768` (paideia-as#1352) with the
# `deterministic` feature so seed-driven keygen / encaps stays byte-
# reproducible against the NIST ACVP known-answer vectors. Kept in
# lockstep with `sha3 = "0.10"` above — this is `ml-kem`'s only
# transitive hash dep and we already pin `sha3` at the workspace level.
ml-kem = { version = "0.2", default-features = false }
rand_core = "0.6"
signature = "2"
argon2 = "0.5"

# Testing
insta = { version = "1", features = ["filters"] }
proptest = "1"
iced-x86 = "1"
tempfile = "3"
assert_cmd = "2"

# Text processing
regex = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `panic = "abort"` is REQUIRED at the workspace level for the
# `paideia-satellite-runtime` staticlib to compile: Rust's per-package
# profile-override list (cargo book, "Overrides") does not include
# `panic`, so this decision is workspace-wide by construction. The
# staticlib's `-nostdlib` satellite consumer cannot resolve
# `_Unwind_*` symbols; without abort here the compiler would still
# emit unwinding scaffolding into the archive.
#
# Safety review of the whole-workspace impact (2026-09-02):
#   * No workspace crate calls `std::panic::catch_unwind` or
#     `resume_unwind` (grep-verified across `crates/`, `tests/`,
#     `tools/`).
#   * `cargo test` uses the `test` profile (inherits from `dev`),
#     which retains `panic = "unwind"`, so `should_panic` and
#     panic-observing tests continue to work.
#   * Kernel-side rlib consumers (`paideia-as-runtime` and friends)
#     already run in bare-metal contexts where unwinding is a
#     non-starter, so `abort` semantics here matches their runtime.
#   * The `paideia-as` binary itself gets abort semantics on release
#     builds; the compiler does not catch its own panics, so this is
#     benign (a panicked pass hard-faults instead of unwinding, which
#     is the same outward-visible outcome for a crash).
panic = "abort"

[profile.dev]
opt-level = 1
