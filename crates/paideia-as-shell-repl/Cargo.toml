[package]
name = "paideia-as-shell-repl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "paideia_as_shell_repl"

# R229.M1 — REPL turn pipeline skeleton for the semantic shell.
#
# Owns the "one turn" state machine: parse → typecheck → elaborate →
# execute → render. R229.M1 lands only the skeleton — the four inner
# stages beyond parse are stubs, so subsequent milestones can grow each
# one (M2 wires HM inference, M3 the pipeline evaluator, M4 the lambda
# JIT, M5 error diagnostics, M6 fingerprint recording) without moving
# the top-level dispatch or the `ReplState` shape around.
#
# The crate owns `ReplState` (turn counter + session EDB) so a driver
# (interactive REPL, `.pds` script runner, R229.M7 replay harness)
# threads a single mutable state through a sequence of `eval_turn`
# calls without needing to know how the turn pipeline is structured
# internally.
#
# What this crate does NOT own:
# * HM type inference — `paideia-as-shell-hm` (R225).
# * Pipeline evaluator — R222 (`paideia-as-shell-cmd` today; R229.M3
#   wires the command dispatch through here).
# * Datalog fixpoint — `paideia-as-shell-datalog` (R226).
# * Command registry / dispatcher — `paideia-as-shell-cmd` (R123/R222).
# * Terminal I/O, line editing, prompt rendering — R220 (readline layer).
#
# Kept dep-lean: only shell-ast + shell-datalog + shell-lex + unicode.
# HM (R225) wiring lands in M2 when the elaborator stops being an
# identity pass and starts producing typed nodes.

[dependencies]
# The unified AST + parser entry (`paideia_as_shell_ast::parser::parse`)
# that stage-1 of `eval_turn` calls. `crate::lower` also consumes its
# `SyntaxNode` shape directly (no re-parse).
paideia-as-shell-ast = { path = "../paideia-as-shell-ast" }
# The seminaïve Datalog evaluator + `SessionEdb` overlay + R226.M9
# `SchemaRegistry` / typed query path (`Evaluator::run_query_typed`)
# that stage-4 uses for the `SyntaxNode::DatalogBlock` execution branch.
# `SessionEdb` is embedded in `ReplState` so assertions persist across
# turns per R226.M8; R229.M2 does not yet route it through the typed
# pass (see the `execute_datalog` doc).
paideia-as-shell-datalog = { path = "../paideia-as-shell-datalog" }
# R229.M3 wires the R222 command-registry surface (`CommandSig` + the
# `argparse` argv typechecker) through the executor's `Cmd` branch.
# The registry itself lives on `ReplState.cmd_registry`; the executor
# reads it (never mutates it — command *registration* is a driver-time
# concern per R222.M4).
paideia-as-shell-cmd = { path = "../paideia-as-shell-cmd" }
# R225.M4 wires HM Algorithm W into stage 2 of the turn pipeline.
# `type_stage::type_check` walks the shell-ast `SyntaxNode` into a
# shell-hm `Expr` and drives `infer(...)`. Only the lambda subset of
# the AST is covered (LitInt/LitStr/Var/Ident/Lambda/App/Let/Group/
# FieldAccess/RecordExpr, plus Cmd-with-empty-args pass-through when
# the head is a value-shaped node); every other shape returns
# `TypeStageError::UnsupportedNode` and the turn continues with
# `inferred_type: None`. Real HM errors (UnboundVar, UnifyFailed) do
# abort the turn with the `type:` prefix.
paideia-as-shell-hm = { path = "../paideia-as-shell-hm" }

# R229.M1's dependence on `paideia-as-shell-lex` + `paideia-as-unicode`
# is gone in M2: the datalog branch no longer re-tokenizes the source
# because `crate::lower::lower_datalog` walks the shell-ast tree
# directly. Re-add them when a future milestone brings a re-tokenizing
# stage back (unlikely — every downstream path R229 wires uses the
# same AST vocabulary).

[dev-dependencies]
