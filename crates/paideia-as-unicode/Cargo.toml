[package]
name = "paideia-as-unicode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "paideia_as_unicode"

# R221.M1 + R221.M2 + R221.M3 — semantic-shell Unicode substrate.
#
# Hosts the UTF-8 decoder (RFC 3629, streaming), the NFC normalizer
# (UAX#15, per SH-D9.4 — every string crossing an IPC boundary is
# normalized to NFC), and the TR#29 grapheme-cluster boundary iterator
# the R229 REPL line editor's cursor-position math consumes.
#
# The bulky Unicode Character Database tables live in the vetted
# crates.io crates `unicode-normalization` (Servo, MIT/Apache) and
# `unicode-segmentation` (Servo, MIT/Apache), per the R221 plan §4
# "prefer crates.io UCD tables over a hand-rolled subset" bullet — the
# combined UCD 15.1 tables are ~300 KiB of static data whose
# hand-maintenance would dwarf every other module in this crate. Our
# surface owns the *paideia-as vocabulary* (`Utf8Error`, `Utf8Decoder`,
# `GraphemeBoundaries`, the ASCII fast path, and the R229-facing
# `grapheme_advance` cursor helper), the fingerprint-stamped test
# corpus (per feedback_workerbee_verify_claims.md), and the invariants
# semantic-shell R221..R229 rely on.
#
# Kept intentionally shallow: no dependency on any other paideia-as
# crate. `paideia-as-stdlib` may re-export helpers from here in a
# follow-on milestone; the elaborator does not import this crate
# directly (the R220.M4 `Str::eq` NFC contract is enforced at
# elaboration time by lowering to `nfc_normalize` calls at codegen —
# outside this crate's scope).

[dependencies]
# UAX#15 NFC canonical decomposition + composition tables (~200 KiB).
unicode-normalization = { workspace = true }
# UAX#29 extended-grapheme-cluster boundary tables + iterator (~50 KiB).
unicode-segmentation = { workspace = true }
# UAX#11 East-Asian width tables (~30 KiB). Used by R221.M3 (`width.rs`)
# for the R229 REPL renderer's cursor-column math. Latin + CJK width
# variants are both consulted so we can synthesize the `Ambiguous`
# discriminator UAX#11 requires (the crate itself splits its API but
# does not expose the four-way property directly).
unicode-width = { workspace = true }
# UNI-2 (paideia-as#1589) — UCD CaseFolding.txt (common + full folds)
# driver for `src/case.rs`. The crate's `default_case_fold_str` and
# per-char `default_case_fold_char` iterator feed `fold(_, Default)`;
# the Turkic locale pre-empts the two I/i dotted/dotless codepoints
# before falling back to the per-char iterator. Shares the same UCD
# cadence as `unicode-normalization` above.
caseless = { workspace = true }
# UNI-3 (paideia-as#1590) — UAX #14 line-break opportunities for
# `src/segment.rs`. `unicode-linebreak::linebreaks(&str)` yields the
# raw (byte-offset, class) stream we map to the paideia-as-vocabulary
# `LineBreakOpportunity`; `wrap_at_width` consumes that stream and
# composes it with UNI-W1's `str_width` + grapheme-cluster segmentation
# so wrap decisions are column-correct against the R229 renderer. See
# `src/segment.rs` for the semantic-shell wrap convention and the
# `LineBreak` enum / `SegmentError` surface it owns above this crate.
unicode-linebreak = { workspace = true }
# UNI-5 (paideia-as#1592) — UCD property adapter.
# `unicode-properties` drives `general_category(char)`,
# `unicode-script` drives `script(char)` and provides the re-exported
# `Script` enum, `unicode-blocks` drives `block(char)` via a
# `UnicodeBlock::start()`-keyed match. See `src/ucd.rs` module header
# for the dependency-choice rationale and the fallback plan if the
# vendored UCD data files (UNI-7) later override one of these
# crates' tables.
unicode-properties = { workspace = true }
unicode-script = { workspace = true }
unicode-blocks = { workspace = true }

[dev-dependencies]
# Round-trip / boundary-ordering property tests (100 kg/s throughput
# claim in the R221.M2 acceptance is measured by a criterion bench in a
# follow-on milestone; the correctness property test lives here).
proptest = { workspace = true }
# The R221.M3 `str_width = Σ grapheme_width` invariant test iterates
# graphemes directly (rather than paying the boundary-→-cluster
# round-trip). Same crate this package's public path already depends
# on, so no new external surface area.
unicode-segmentation = { workspace = true }
